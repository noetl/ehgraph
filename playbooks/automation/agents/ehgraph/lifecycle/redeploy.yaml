apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: ehgraph_lifecycle_redeploy
  path: automation/agents/ehgraph/lifecycle/redeploy
  agent: true
executor:
  profile: local
  version: noetl-runtime/1
workload:
  mcp_resource:
    path: ""
    metadata: {}
    spec:
      deployment: {}
  verb: redeploy
workflow:
  - step: redeploy
    desc: Roll the single pod onto the current image. The data volume stays attached.
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          # E2/E4 guard (noetl/ehgraph#10): an embedded domain's primary lives in its host.
          # Deploying, deleting, or rolling a standalone pod for it would make a second
          # primary on another volume, or act on the wrong workload. Refuse.
          EMBEDDED_DOMAINS="noetl-cluster"
          MODE='{{ workload.mcp_resource.spec.deployment.mode | default("standalone") }}'
          GUARD_DOMAIN='{{ workload.mcp_resource.spec.deployment.domain | default(workload.mcp_resource.path | split("/") | last) }}'
          if [ "$MODE" = "embedded" ]; then
            echo "refusing redeploy: ${GUARD_DOMAIN} is embedded (spec.deployment.mode: embedded); roll its host instead" >&2
            exit 2
          fi
          for embedded in $EMBEDDED_DOMAINS; do
            if [ "$GUARD_DOMAIN" = "$embedded" ]; then
              echo "refusing redeploy: ${GUARD_DOMAIN} is an embedded domain (E4) and has no standalone StatefulSet" >&2
              exit 2
            fi
          done
          NAME='{{ workload.mcp_resource.metadata.name }}'
          NAMESPACE='{{ workload.mcp_resource.spec.deployment.namespace | default("ehgraph") }}'
          kubectl rollout restart statefulset "$NAME" -n "$NAMESPACE"
          kubectl rollout status statefulset "$NAME" -n "$NAMESPACE"
