# One file per instance. The instance_id convention is ehgraph-<domain>.
instance_id = "ehgraph-network"
domain = "network"
data_dir = "/var/lib/ehgraph"
# A directory, or a GCS prefix: backup_prefix = "gs://noetl-ehgraph/ehgraph-network"
backup_prefix = "/var/backups/ehgraph/ehgraph-network"
listen = "0.0.0.0:8080"
role = "primary"
backup_interval_s = 30

# Only for a gs:// backup_prefix. These are the defaults.
# [backup]
# endpoint = "https://storage.googleapis.com"
# auth = "metadata"        # GKE Workload Identity; or "env:VAR" (bearer token), or "none" (emulator)
# timeout_s = 60

[budgets]
global_bytes = 268435456
per_session_bytes = 67108864

[session]
idle_timeout_s = 300
max_lifetime_s = 86400
grace_s = 2

[store]
seal_max_bytes = 8388608
seal_max_records = 1024
# Age seal is on. This bounds the unshipped tail (the backup RPO window).
seal_max_age_s = 30
snapshot_keep = 16
# Idempotency keys: remembered this long on the log clock, and at most this many per namespace.
idempotency_window_s = 86400
idempotency_max_keys = 100000

[auth]
mode = "bearer"

[[auth.grants]]
token = "replace-me"
principal = "qnetmon"
namespace = "qnetmon"
read = true
write = true

[[auth.grants]]
token = "replace-me-ops"
principal = "ops"
namespace = "*"
read = true
write = true
