# Render with scripts/render-deploy.sh <domain>.
# One StatefulSet per topology domain. replicas is 1: a second process on the
# same volume is refused by the data-directory lock.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ehgraph-noetl-cluster
  namespace: ehgraph
  labels:
    app: ehgraph
    ehgraph.io/domain: noetl-cluster
    ehgraph.io/instance: ehgraph-noetl-cluster
spec:
  serviceName: ehgraph-noetl-cluster
  replicas: 1
  selector:
    matchLabels:
      app: ehgraph
      ehgraph.io/instance: ehgraph-noetl-cluster
  template:
    metadata:
      labels:
        app: ehgraph
        ehgraph.io/domain: noetl-cluster
        ehgraph.io/instance: ehgraph-noetl-cluster
    spec:
      containers:
        - name: ehgraph
          image: ghcr.io/noetl/ehgraph:latest
          args: ["serve", "--config", "/etc/ehgraph/config.toml"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: EHGRAPH_INSTANCE_ID
              value: ehgraph-noetl-cluster
            - name: EHGRAPH_DOMAIN
              value: noetl-cluster
          volumeMounts:
            - name: data
              mountPath: /var/lib/ehgraph
            - name: config
              mountPath: /etc/ehgraph
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
      volumes:
        - name: config
          configMap:
            name: ehgraph-noetl-cluster
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ehgraph-noetl-cluster
  namespace: ehgraph
  labels:
    app: ehgraph
    ehgraph.io/instance: ehgraph-noetl-cluster
spec:
  selector:
    app: ehgraph
    ehgraph.io/instance: ehgraph-noetl-cluster
  ports:
    - name: http
      port: 8080
      targetPort: http
