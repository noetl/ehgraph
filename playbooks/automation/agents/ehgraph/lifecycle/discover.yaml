apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: ehgraph_lifecycle_discover
  path: automation/agents/ehgraph/lifecycle/discover
  agent: true
executor:
  profile: local
  version: noetl-runtime/1
workload:
  mcp_resource:
    path: ""
    metadata: {}
    spec: {}
  verb: discover
workflow:
  - step: discover
    desc: List the MCP tools published by this instance.
    tool:
      kind: shell
      cmds:
        - |
          set -euo pipefail
          URL='{{ workload.mcp_resource.spec.discovery.tools_list_url }}'
          curl -fsS "$URL"
